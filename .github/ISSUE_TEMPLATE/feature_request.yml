name: 功能建议 / Feature request
description: 提出有明确使用场景的功能或改进。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景；涉及契约、数据库迁移或部署方式变化时，一并写清影响面。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 谁在什么情况下需要它？目前哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改进
      description: 描述希望看到的行为或结果，也可以附具体例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法（可选）
      description: 现有配置、脚本或其他方案为什么不能满足需求？
  - type: textarea
    id: impact
    attributes:
      label: 影响面（可选）
      description: 是否涉及契约、数据库迁移、公开 API、后台流程或部署变更？
